apiVersion: v1
kind: ServiceAccount
metadata:
  name: carts
  labels:
    {{- include "retail-store.labels" . | nindent 4 }}
    app.kubernetes.io/name: carts
    app.kubernetes.io/component: service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: carts
data:
  RETAIL_CART_PERSISTENCE_PROVIDER: {{ .Values.carts.dynamodb.provider | default "dynamodb" }}
  RETAIL_CART_PERSISTENCE_DYNAMODB_TABLE_NAME: {{ .Values.carts.dynamodb.tableName }}
  RETAIL_CART_PERSISTENCE_DYNAMODB_CREATE_TABLE: {{ .Values.carts.dynamodb.createTable | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.carts.dynamodb.awsAccessKey }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.carts.dynamodb.awsSecretKey }}
  RETAIL_CART_PERSISTENCE_DYNAMODB_ENDPOINT: "http://carts-dynamodb:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: carts-dynamodb
  labels:
    {{- include "retail-store.labels" . | nindent 4 }}
    app.kubernetes.io/name: carts
    app.kubernetes.io/component: dynamodb
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: dynamodb
      protocol: TCP
      name: dynamodb
  selector:
    app.kubernetes.io/name: carts
    app.kubernetes.io/component: dynamodb
---
apiVersion: v1
kind: Service
metadata:
  name: carts
  labels:
    {{- include "retail-store.labels" . | nindent 4 }}
    app.kubernetes.io/name: carts
    app.kubernetes.io/component: service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: carts
    app.kubernetes.io/component: service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carts
  labels:
    {{- include "retail-store.labels" . | nindent 4 }}
    app.kubernetes.io/name: carts
    app.kubernetes.io/component: service
spec:
  replicas: {{ .Values.carts.replicaCount }}
  strategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: carts
      app.kubernetes.io/component: service
  template:
    metadata:
      annotations:
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
      labels:
        app.kubernetes.io/name: carts
        app.kubernetes.io/component: service
    spec:
      serviceAccountName: carts
      securityContext:
        fsGroup: 1000
      containers:
        - name: carts
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.carts.image }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: JAVA_OPTS
              value: -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/urandom
          envFrom:
            - configMapRef:
                name: carts
          securityContext:
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.carts.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp-volume
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carts-dynamodb
  labels:
    {{- include "retail-store.labels" . | nindent 4 }}
    app.kubernetes.io/name: carts
    app.kubernetes.io/component: dynamodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: carts
      app.kubernetes.io/component: dynamodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: carts
        app.kubernetes.io/component: dynamodb
    spec:
      containers:
        - name: dynamodb
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.carts.dynamodb.image }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: dynamodb
              containerPort: 8000
              protocol: TCP