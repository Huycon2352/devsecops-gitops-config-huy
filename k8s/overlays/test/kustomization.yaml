apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
    # Tên thư mục chứa Chart.yaml (Kustomize dùng trường này làm tên thư mục luôn)
  - name: chart
    # Đường dẫn tương đối trỏ tới thư mục CHA của thư mục 'chart'
    chartHome: ../..
    releaseName: retail-store-dev
    valuesFile: ../../chart/values-dev.yaml
    valuesInline:
      tags:
        environment: "development"
      ui:
        replicaCount: 1 
      catalog:
        replicaCount: 1

patches:
  - path: patch-ui-service.yaml