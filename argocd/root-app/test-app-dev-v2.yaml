apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: retail-store-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Huycon2352/devsecops-gitops-config-huy.git' 
    targetRevision: HEAD
    path: k8s/overlays/test
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true