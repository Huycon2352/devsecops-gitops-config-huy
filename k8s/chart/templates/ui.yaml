apiVersion: v1
kind: ServiceAccount
metadata:
  name: ui
  labels:
    {{- include "retail-store.labels" . | nindent 4 }}
    app.kubernetes.io/name: ui
    app.kubernetes.io/component: service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ui
data:
  RETAIL_UI_THEME: {{ .Values.ui.theme | quote }}
  RETAIL_UI_ENDPOINTS_CATALOG: "http://catalog"
  RETAIL_UI_ENDPOINTS_CARTS: "http://carts"
  RETAIL_UI_ENDPOINTS_CHECKOUT: "http://checkout"
  RETAIL_UI_ENDPOINTS_ORDERS: "http://orders"
  RETAIL_UI_SEARCH_ENABLED: {{ .Values.ui.searchEnabled | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  labels:
    {{- include "retail-store.labels" . | nindent 4 }}
    app.kubernetes.io/name: ui
    app.kubernetes.io/component: service
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: ui
    app.kubernetes.io/component: service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  labels:
    {{- include "retail-store.labels" . | nindent 4 }}
    app.kubernetes.io/name: ui
    app.kubernetes.io/component: service
spec:
  replicas: {{ .Values.ui.replicaCount }}
  strategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: ui
      app.kubernetes.io/component: service
  template:
    metadata:
      annotations:
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
      labels:
        app.kubernetes.io/name: ui
        app.kubernetes.io/component: service
    spec:
      serviceAccountName: ui
      securityContext:
        fsGroup: 1000
      containers:
        - name: ui
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.ui.image }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/urandom"
            - name: METADATA_KUBERNETES_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: METADATA_KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: METADATA_KUBERNETES_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          envFrom:
            - configMapRef:
                name: ui
          securityContext:
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp-volume
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory