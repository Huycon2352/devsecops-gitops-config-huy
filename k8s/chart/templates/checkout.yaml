apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkout
  labels:
    {{- include "retail-store.labels" . | nindent 4 }}
    app.kubernetes.io/name: checkout
    app.kubernetes.io/component: service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout
data:
  RETAIL_CHECKOUT_PERSISTENCE_PROVIDER: "redis"
  RETAIL_CHECKOUT_PERSISTENCE_REDIS_URL: "redis://checkout-redis:6379"
  RETAIL_CHECKOUT_ENDPOINTS_ORDERS: "http://orders:80"
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-redis
  labels:
    {{- include "retail-store.labels" . | nindent 4 }}
    app.kubernetes.io/name: checkout
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: checkout
    app.kubernetes.io/component: redis
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  labels:
    {{- include "retail-store.labels" . | nindent 4 }}
    app.kubernetes.io/name: checkout
    app.kubernetes.io/component: service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: checkout
    app.kubernetes.io/component: service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  labels:
    {{- include "retail-store.labels" . | nindent 4 }}
    app.kubernetes.io/name: checkout
    app.kubernetes.io/component: service
spec:
  replicas: {{ .Values.checkout.replicaCount }}
  strategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout
      app.kubernetes.io/component: service
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
      labels:
        app.kubernetes.io/name: checkout
        app.kubernetes.io/component: service
    spec:
      serviceAccountName: checkout
      securityContext:
        fsGroup: 1000
      containers:
        - name: checkout
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.checkout.image }}"
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: checkout
          securityContext:
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            {{- toYaml .Values.checkout.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp-volume
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-redis
  labels:
    {{- include "retail-store.labels" . | nindent 4 }}
    app.kubernetes.io/name: checkout
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.checkout.redis.image }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP