apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: retail-app-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Huycon2352/devsecops-gitops-config-huy.git'
    targetRevision: HEAD
    path: k8s/chart
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # ĐƯỢC SỬA TẠI ĐÂY: Chuyển createNamespace vào trong syncOptions
    syncOptions:
      - CreateNamespace=true

